[package]
name = "adb-phone-backup"
version = "2.0.0"
description = "ADB Phone Backup — Modern Windows desktop UI preserving the Python Smart Auto-Skip backup engine"
authors = ["Wildan Nazhif"]
license = "MIT"
edition = "2021"

[lib]
name = "adb_phone_backup_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
