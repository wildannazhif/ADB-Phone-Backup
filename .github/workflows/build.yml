name: Build Windows Desktop Application

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies & Test Suite
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<80"
          pip install pyinstaller pillow pytest

      - name: Run Python Backend & IPC Unit Tests
        run: |
          python -m pytest tests/test_backend.py -v

      - name: Set up Android Platform Tools (ADB)
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "C:\"

      - name: Stage Standalone Runtime & ADB Bundle
        run: |
          python scripts/prepare_bundle.py --platform-tools C:\platform-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build Frontend Production Assets
        run: |
          npm run build

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Checks & Unit Tests
        run: |
          cd src-tauri
          cargo test --verbose

      - name: Build Tauri Desktop Application
        run: |
          npx tauri build

      - name: Build Legacy PyInstaller Standalone Executable
        run: |
          python build_exe.py

      - name: Stage Dist Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName -Destination "dist/ADB-Phone-Backup-Setup.exe" -Force
            Write-Host "Copied NSIS installer to dist/ADB-Phone-Backup-Setup.exe"
          } else {
            Write-Warning "NSIS installer not found!"
          }

      - name: Upload Tauri Desktop Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ADB-Phone-Backup-Desktop-Tauri
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Standalone PyInstaller Executable
        uses: actions/upload-artifact@v4
        with:
          name: ADB-Phone-Backup-Portable-PyInstaller
          path: dist/ADB-Phone-Backup.exe

      - name: Commit Executable Binaries to Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.exe
          $status = git status --porcelain dist/
          if ($status) {
            git commit -m "build: compile standalone Windows .exe binaries (Tauri Setup + Portable PyInstaller) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "No executable changes to commit"
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "ADB Phone Backup Pro v2.0.0"
          body: |
            ## 📱 ADB Phone Backup Pro v2.0.0 — Standalone Windows Executables

            Pilih executable sesuai kebutuhan Anda:

            1. **`ADB-Phone-Backup-Setup.exe`** (Installer Resmi — Disarankan):
               - Aplikasi desktop modern (Tauri 2 + React + Tailwind CSS).
               - Installer mandiri NSIS lengkap dengan shortcut desktop & menu start.
               - Mengemas runtime Python embeddable dan biner ADB (`platform-tools`). **Tidak perlu instalasi Python atau Node.js!**

            2. **`ADB-Phone-Backup.exe`** (Portable Single-File):
               - Versi portabel mandiri tanpa instalasi (PyInstaller).
               - Cukup klik dua kali langsung berjalan.
          draft: false
          prerelease: false
          files: |
            dist/ADB-Phone-Backup-Setup.exe
            dist/ADB-Phone-Backup.exe
            src-tauri/target/release/bundle/msi/*.msi
